[package]
name = "claudeview"
version = "0.1.0"
description = "ClaudeView for Linux/COSMIC"
authors = ["Flavio Gabriel <flaviogabrielsr0507@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claudeview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No tray-icon/image-png features: the tray is served directly via `ksni`
# (Tauri's libayatana-appindicator tray fails to register on COSMIC).
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
notify = "6"
toml = "0.8"
# Direct StatusNotifierItem tray (pure-Rust, via zbus). Replaces Tauri's
# libayatana-appindicator tray, which fails to register on COSMIC.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
png = "0.17"

