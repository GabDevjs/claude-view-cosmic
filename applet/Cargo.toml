[package]
name = "claudeview-applet"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "COSMIC panel applet showing Claude Code 5h/7d usage as text"

[[bin]]
name = "claudeview-applet"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# Same feature set the official cosmic-applet-template uses, so this builds
# against current libcosmic on COSMIC (Pop!_OS 24.04).
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]
